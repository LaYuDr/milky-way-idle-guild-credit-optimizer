  <style>
    body { margin: 0; min-height: 100vh; background: #10111c; color: #eee; font: 16px system-ui, sans-serif; }

        "/items/cheese": { itemHrid: "/items/cheese", name: "Cheese" },

        },

        }

          shrineHrid: "/guild_shrines/tempo",

          ]
        },

      },

  <script src="/runtime.js"></script>
  <script>
    document.getElementById("close-exchange-modal").addEventListener("click", () => {
      document.getElementById("test-exchange-modal")?.remove();
    });

    const waitFor = (predicate, timeoutMs = 4000) => new Promise((resolve, reject) => {
      const startedAt = performance.now();
      const check = () => {
        const result = predicate();
        if (result) return resolve(result);
        if (performance.now() - startedAt >= timeoutMs) return reject(new Error("Layout audit setup timed out"));
        setTimeout(check, 25);
      };
      check();
    });

    const elementRect = (element) => {
      if (!element) return null;
      const rect = element.getBoundingClientRect();
      return { x: rect.x, y: rect.y, width: rect.width, height: rect.height, right: rect.right, bottom: rect.bottom };
    };

    window.__mwiLayoutAuditContract = {
      widths: [320, 360, 420, 460, 480, 520, 560, 610, 720, 900, 1200],
      breakpoints: { compactMax: 400, intermediateMax: 520, summaryMax: 650 },
      budgetSnapPercentages: [20, 40, 50, 60, 80, 100],
      maximumHorizontalOverflow: 0,
      maximumInlinePlanHeight: 48,
      maximumCompactPlanHeight: 122,
      targetPlans: 4
    };

    window.__mwiCollectLayoutAudit = () => {
      const root = document.getElementById("mwi-credit-optimizer");
      if (!root) throw new Error("Plugin panel is unavailable");
      const planRows = Array.from(root.querySelectorAll(".mwi-upgrade-plan"));
      const planColumns = root.querySelector(".mwi-upgrade-plan-columns");
      const budget = root.querySelector(".mwi-token-budget");
      const budgetHeading = root.querySelector(".mwi-token-budget-heading");
      const budgetInputs = root.querySelector(".mwi-token-budget-inputs");
      const budgetAvailable = root.querySelector(".mwi-token-budget-available");
      const budgetRange = root.querySelector('[data-role="guild-token-budget-range"]');
      const budgetPercentage = root.querySelector('[data-role="guild-token-budget-percent"]');
      const materialRows = Array.from(root.querySelectorAll(".mwi-material-row"));
      const plannedMaterialRow = materialRows.find((row) => row.querySelector(".mwi-material-plan"));
      const plannedMaterialMethods = plannedMaterialRow && plannedMaterialRow.querySelector(".mwi-material-plans");
      const auditElements = Array.from(root.querySelectorAll(".mwi-upgrade-planner,.mwi-upgrade-planner *,.mwi-token-budget,.mwi-token-budget *,.mwi-upgrade-cost-summary,.mwi-upgrade-cost-summary *,.mwi-material-row,.mwi-material-row *"));
      const visibleAuditElements = auditElements.filter((element) => {
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
      });
      const overflow = visibleAuditElements.filter((element) => {
        const style = getComputedStyle(element);
        const intentionallyEllipsized = style.textOverflow === "ellipsis" && ["hidden", "clip"].includes(style.overflowX);
        return (!intentionallyEllipsized && element.scrollWidth > element.clientWidth + 2) || element.scrollHeight > element.clientHeight + 2;
      }).map((element) => ({
        className: String(element.className || ""),
        role: element.getAttribute("data-role") || "",
        clientWidth: element.clientWidth,
        clientHeight: element.clientHeight,
        scrollWidth: element.scrollWidth,
        scrollHeight: element.scrollHeight
      }));
      const boundaryOverflow = visibleAuditElements.filter((element) => {
        const parent = element.parentElement;
        if (!parent || parent === root || getComputedStyle(parent).overflow === "visible") return false;
        const rect = element.getBoundingClientRect();
        const parentRect = parent.getBoundingClientRect();
        return rect.left < parentRect.left - 1 || rect.right > parentRect.right + 1 || rect.top < parentRect.top - 1 || rect.bottom > parentRect.bottom + 1;
      }).map((element) => ({
        className: String(element.className || ""),
        role: element.getAttribute("data-role") || "",
        parentClassName: String(element.parentElement?.className || "")
      }));
      const interactiveElements = visibleAuditElements.filter((element) => ["BUTTON", "INPUT", "SELECT"].includes(element.tagName));
      const controlOverlaps = [];
      for (let leftIndex = 0; leftIndex < interactiveElements.length; leftIndex += 1) {
        for (let rightIndex = leftIndex + 1; rightIndex < interactiveElements.length; rightIndex += 1) {
          const left = interactiveElements[leftIndex];
          const right = interactiveElements[rightIndex];
          if (left.contains(right) || right.contains(left)) continue;
          const leftRect = left.getBoundingClientRect();
          const rightRect = right.getBoundingClientRect();
          const overlapWidth = Math.min(leftRect.right, rightRect.right) - Math.max(leftRect.left, rightRect.left);
          const overlapHeight = Math.min(leftRect.bottom, rightRect.bottom) - Math.max(leftRect.top, rightRect.top);
          if (overlapWidth > 1 && overlapHeight > 1) controlOverlaps.push({
            leftRole: left.getAttribute("data-role") || left.tagName,
            rightRole: right.getAttribute("data-role") || right.tagName,
            overlapWidth,
            overlapHeight
          });
        }
      }
      const headingRect = elementRect(budgetHeading);
      const inputsRect = elementRect(budgetInputs);
      const availableRect = elementRect(budgetAvailable);
      const rootStyle = getComputedStyle(root);
      const contentWidth = root.clientWidth - parseFloat(rootStyle.paddingLeft) - parseFloat(rootStyle.paddingRight);
      const breakpoints = window.__mwiLayoutAuditContract.breakpoints;
      return {
        requestedSidebarWidth: sidebarWidth,
        viewport: { width: window.innerWidth, height: window.innerHeight },
        sidebar: elementRect(document.getElementById("test-sidebar-wrapper")),
        panel: {
          band: contentWidth <= breakpoints.compactMax ? "compact" : contentWidth <= breakpoints.intermediateMax ? "intermediate" : "wide",
          contentWidth,
          clientWidth: root.clientWidth,
          scrollWidth: root.scrollWidth,
          scrollHeight: root.scrollHeight
        },
        overflow,
        boundaryOverflow,
        controlOverlaps,
        shrine: {
          count: planRows.length,
          mode: planColumns && getComputedStyle(planColumns).display !== "none" ? "inline" : "condensed",
          columns: planRows[0] ? getComputedStyle(planRows[0]).gridTemplateColumns : "",
          rowHeights: planRows.map((row) => elementRect(row).height),
          plannerHeight: elementRect(root.querySelector(".mwi-upgrade-planner"))?.height || 0
        },
        budget: {
          height: elementRect(budget)?.height || 0,
          mode: headingRect && inputsRect && Math.abs(headingRect.y - inputsRect.y) < 8 ? "inline" : "wrapped",
          heading: headingRect,
          inputs: inputsRect,
          available: availableRect,
          range: elementRect(budgetRange),
          percentage: budgetPercentage?.textContent || "",
          snapPercentages: Array.from(root.querySelectorAll(".mwi-token-budget-snap-points i"), (mark) => Number(mark.dataset.percentage))
        },
        materials: {
          rowCount: materialRows.length,
          mode: plannedMaterialMethods && getComputedStyle(plannedMaterialMethods).gridColumnStart === "4" ? "inline" : "wrapped",
          rowColumns: plannedMaterialRow ? getComputedStyle(plannedMaterialRow).gridTemplateColumns : "",
          methodColumns: plannedMaterialMethods ? getComputedStyle(plannedMaterialMethods).gridTemplateColumns : "",
          rowHeights: materialRows.map((row) => elementRect(row).height)
        },
        summary: {
          planHeight: elementRect(root.querySelector(".mwi-plan-summary"))?.height || 0,
          costHeight: elementRect(root.querySelector(".mwi-upgrade-cost-summary"))?.height || 0
        }
      };
    };

    const prepareLayoutAudit = async () => {
      document.getElementById("test-exchange-modal")?.remove();
      const creditTab = await waitFor(() => document.querySelector('[data-mwi-credit-tab="true"]'));
      creditTab.click();
      const upgradeTab = await waitFor(() => document.querySelector('[data-role="view-upgrade"]'));
      upgradeTab.click();
      const list = await waitFor(() => document.querySelector('[data-role="upgrade-plan-list"]'));
      const targetPlans = Math.min(4, Math.max(1, Number(searchParams.get("auditPlans")) || window.__mwiLayoutAuditContract.targetPlans));
      while (list.querySelectorAll(".mwi-upgrade-plan").length < targetPlans) {
        const add = document.querySelector('[data-role="add-upgrade-plan"]');
        if (!add || add.disabled) break;
        add.click();
        await new Promise((resolve) => setTimeout(resolve, 40));
      }
      await new Promise((resolve) => setTimeout(resolve, 250));
      const report = window.__mwiCollectLayoutAudit();
      document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
      document.body.dataset.layoutAuditReady = "true";
      return report;
    };

    window.__mwiLayoutAuditReady = layoutAudit ? prepareLayoutAudit() : Promise.resolve(null);

    const prepareCreditAudit = async () => {
      document.getElementById("test-exchange-modal")?.remove();
      const creditTab = await waitFor(() => document.querySelector('[data-mwi-credit-tab="true"]'));
      creditTab.click();
      const panel = await waitFor(() => document.getElementById("mwi-credit-optimizer"));
      const defaultView = panel.dataset.activeView;
      const creditViewTab = await waitFor(() => panel.querySelector('[data-role="view-credit"]'));
      creditViewTab.click();
      await waitFor(() => panel.querySelectorAll(".mwi-credit-section").length === 8);
      document.body.dataset.creditAuditDefaultView = defaultView;
      document.body.dataset.creditAuditReady = "true";
      return { defaultView };
    };

    window.__mwiCreditLayoutAuditReady = creditAudit ? prepareCreditAudit() : Promise.resolve(null);

    window.__mwiCollectConstructionAudit = () => {
      const root = document.getElementById("mwi-credit-optimizer");
      if (!root) throw new Error("Plugin panel is unavailable");
      const layout = root.querySelector(".mwi-construction-layout");
      const buildingRows = Array.from(root.querySelectorAll(".mwi-building-row"));
      const queueSteps = Array.from(root.querySelectorAll(".mwi-construction-step"));
      const auditElements = Array.from(root.querySelectorAll("[data-role='construction-view'],[data-role='construction-view'] *"));
      const visibleAuditElements = auditElements.filter((element) => {
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
      });
      const horizontalOverflow = visibleAuditElements.filter((element) => {
        const style = getComputedStyle(element);
        const intentionallyEllipsized = style.textOverflow === "ellipsis" && ["hidden", "clip"].includes(style.overflowX);
        return !intentionallyEllipsized && element.scrollWidth > element.clientWidth + 2;
      }).map((element) => ({
        className: String(element.className || ""),
        role: element.getAttribute("data-role") || "",
        clientWidth: element.clientWidth,
        scrollWidth: element.scrollWidth
      }));
      const interactiveElements = visibleAuditElements.filter((element) => ["BUTTON", "INPUT", "SELECT"].includes(element.tagName));
      const controlOverlaps = [];
      for (let leftIndex = 0; leftIndex < interactiveElements.length; leftIndex += 1) {
        for (let rightIndex = leftIndex + 1; rightIndex < interactiveElements.length; rightIndex += 1) {
          const left = interactiveElements[leftIndex];
          const right = interactiveElements[rightIndex];
          if (left.contains(right) || right.contains(left)) continue;
          const leftRect = left.getBoundingClientRect();
          const rightRect = right.getBoundingClientRect();
          const overlapWidth = Math.min(leftRect.right, rightRect.right) - Math.max(leftRect.left, rightRect.left);
          const overlapHeight = Math.min(leftRect.bottom, rightRect.bottom) - Math.max(leftRect.top, rightRect.top);
          if (overlapWidth > 1 && overlapHeight > 1) controlOverlaps.push({
            leftRole: left.getAttribute("data-role") || left.tagName,
            rightRole: right.getAttribute("data-role") || right.tagName,
            overlapWidth,
            overlapHeight
          });
        }
      }
      return {
        requestedSidebarWidth: sidebarWidth,
        panel: {
          clientWidth: root.clientWidth,
          scrollWidth: root.scrollWidth,
          horizontalOverflow: root.scrollWidth - root.clientWidth
        },
        layout: {
          columns: layout ? getComputedStyle(layout).gridTemplateColumns : "",
          width: elementRect(layout)?.width || 0
        },
        cards: {
          count: buildingRows.length,
          widths: buildingRows.map((row) => elementRect(row).width),
          minimumWidth: buildingRows.length ? Math.min(...buildingRows.map((row) => elementRect(row).width)) : 0
        },
        catalog: {
          rowCount: buildingRows.length,
          visibleRowCount: buildingRows.filter((row) => getComputedStyle(row).display !== "none").length,
          plannedRowCount: buildingRows.filter((row) => row.dataset.planned === "true").length,
          gameIconCount: root.querySelectorAll('.mwi-building-icon[data-icon-source="game"] svg use[href*="misc_sprite"]').length,
          filterAudit: window.__mwiConstructionFilterAudit || null
        },
        queue: {
          stepCount: queueSteps.length,
          cutoffCount: root.querySelectorAll(".mwi-budget-cutoff").length,
          overBudgetCount: queueSteps.filter((step) => step.dataset.overBudget === "true").length
        },
        budget: {
          value: root.querySelector('[data-role="guild-point-budget"]')?.value || "",
          plannedSpend: root.querySelector('[data-role="construction-planned-spend"]')?.textContent || "",
          overBudget: root.querySelector(".mwi-construction-budget")?.dataset.overBudget || "false"
        },
        horizontalOverflow,
        controlOverlaps
      };
    };

    const prepareConstructionAudit = async () => {
      document.getElementById("test-exchange-modal")?.remove();
      const creditTab = await waitFor(() => document.querySelector('[data-mwi-credit-tab="true"]'));
      creditTab.click();
      const panel = await waitFor(() => document.getElementById("mwi-credit-optimizer"));
      const constructionViewTab = await waitFor(() => panel.querySelector('[data-role="view-construction"]'));
      constructionViewTab.click();
      await waitFor(() => panel.querySelectorAll(".mwi-building-row").length === 28);
      const budgetInput = panel.querySelector('[data-role="guild-point-budget"]');
      budgetInput.value = "5000";
      budgetInput.dispatchEvent(new Event("change", { bubbles: true }));
      const targets = [
        ["/guild_buildings/guild_hall", 5],
        ["/guild_buildings/skilling_encampment", 5],
        ["/guild_buildings/gym", 5]
      ];
      for (const [buildingHrid, targetLevel] of targets) {
        const select = await waitFor(() => panel.querySelector(`[data-role="building-target"][data-building-hrid="${buildingHrid}"]`));
        select.value = String(targetLevel);
        select.dispatchEvent(new Event("change", { bubbles: true }));
        await new Promise((resolve) => setTimeout(resolve, 60));
      }
      await waitFor(() => panel.querySelectorAll(".mwi-construction-step").length === 9);
      const searchInput = panel.querySelector('[data-role="building-search"]');
      searchInput.focus();
      searchInput.value = "gym";
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
      await waitFor(() => Array.from(panel.querySelectorAll(".mwi-building-row")).filter((row) => getComputedStyle(row).display !== "none").length === 1);
      window.__mwiConstructionFilterAudit = {
        visibleCount: Array.from(panel.querySelectorAll(".mwi-building-row")).filter((row) => getComputedStyle(row).display !== "none").length,
        matchedBuilding: panel.querySelector('.mwi-building-row:not([hidden]) .mwi-building-name strong')?.textContent || "",
        searchRetainedFocus: document.activeElement === searchInput
      };
      searchInput.value = "";
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
      await waitFor(() => Array.from(panel.querySelectorAll(".mwi-building-row")).filter((row) => getComputedStyle(row).display !== "none").length === 28);
      await new Promise((resolve) => setTimeout(resolve, 250));
      const report = window.__mwiCollectConstructionAudit();
      document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
      document.body.dataset.constructionAuditReady = "true";
      return report;
    };

    window.__mwiConstructionAuditReady = constructionAudit ? prepareConstructionAudit() : Promise.resolve(null);

    const runPlanStabilityAudit = async () => {
      await window.__mwiLayoutAuditReady;
      const list = await waitFor(() => document.querySelector('[data-role="upgrade-plan-list"]'));
      const firstPlan = await waitFor(() => list.querySelector(".mwi-upgrade-plan"));
      let mutationCount = 0;
      const observer = new MutationObserver((records) => { mutationCount += records.length; });
      observer.observe(list, { attributes: true, childList: true, subtree: true });
      const bridge = window.__mwiGuildCreditBridge;
      for (let index = 0; index < 3; index += 1) {
        bridge.characterItems = bridge.characterItems.map((item) => item.itemHrid === "/items/guild_token" ? { ...item, count: item.count + 1 } : item);
        bridge.characterItemsRevision = Number(bridge.characterItemsRevision || 0) + 1;
        bridge.onCharacterItemsUpdated?.();
        await new Promise((resolve) => setTimeout(resolve, 220));
      }
      observer.disconnect();
      return {
        mutationCount,
        sameFirstPlan: list.querySelector(".mwi-upgrade-plan") === firstPlan,
        indexCount: list.querySelectorAll(".mwi-upgrade-plan-index").length,
        animationName: getComputedStyle(firstPlan).animationName,
        rootOverflow: document.getElementById("mwi-credit-optimizer").scrollWidth - document.getElementById("mwi-credit-optimizer").clientWidth
      };
    };

    if (stabilityAudit) {
      window.__mwiPlanStabilityReady = runPlanStabilityAudit().then((report) => {
        document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
        document.body.dataset.planStabilityReady = "true";
        return report;
      });
    }
  </script>
</html>
