<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>MWI Credit Sidebar Harness</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #10111c;
      color: #eee;
      font:
        16px system-ui,
        sans-serif;
    }
    .test-sidebar-wrapper {
      position: fixed;
      right: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 100vh;
      background: #202139;
    }
    .test-sidebar-resize-gutter {
      position: absolute;
      z-index: 1;
      top: 0;
      bottom: 0;
      left: -5px;
      display: none;
      width: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: col-resize;
      touch-action: none;
    }
    body[data-sidebar-resize-audit="true"] #test-sidebar-wrapper > .test-sidebar-resize-gutter {
      display: block;
    }
    body[data-sidebar-resize-audit="true"] #test-sidebar-wrapper > [data-native-content] {
      padding-left: 0;
    }
    body[data-layout-audit="true"] > #test-page-title,
    body[data-layout-audit="true"] > #toggle-responsive-layout,
    body[data-layout-audit="true"] > #close-exchange-modal {
      display: none;
    }
    body[data-layout-audit="true"] > .test-sidebar-wrapper {
      left: 0;
      right: auto;
    }
    body[data-sidebar-layout="wide"] [data-sidebar-layout="narrow"],
    body[data-sidebar-layout="narrow"] [data-sidebar-layout="wide"] {
      display: none;
    }
    #test-tabs {
      display: flex;
      border-bottom: 1px solid #55567b;
    }
    #test-tabs button {
      flex: 1;
      border: 0;
      padding: 14px 6px;
      background: #292a46;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    #test-tabs button:first-child {
      background: #5053ad;
    }
    [data-native-content] {
      flex: 1;
      min-height: 0;
      padding: 16px;
    }
  </style>
  <main id="test-page-title">本地右侧栏自动化测试页</main>
  <button id="toggle-responsive-layout" type="button">切换窄屏布局</button>
  <button id="close-exchange-modal" type="button">关闭测试兑换窗口</button>
  <output id="layout-audit-output" hidden></output>
  <div class="Modal_modal__test" id="test-exchange-modal" role="dialog" aria-label="测试兑换窗口">
    <div class="GuildPanel_exchangeModalContent__test">
      <div class="Item_item__test" data-test-exchange-item="beast_hide">

      </div>
      <div class="Item_item__test" data-test-exchange-item="guild_token">
        <svg role="img" aria-label="Guild Token"><use href="/assets/items_sprite.svg#guild_token"></use></svg>
      </div>
      <div class="Item_item__test" data-test-exchange-item="green_guild_credit">
        <svg role="img" aria-label="Green Guild Credit">
          <use href="/assets/items_sprite.svg#green_guild_credit"></use>
        </svg>
      </div>
      <div class="GuildPanel_inputContainer__test">
        <div class="GuildPanel_label__test">你支付</div>
        <div class="GuildPanel_quantityInputs__test">
          <input id="test-exchange-payment" type="text" value="300" aria-label="你支付" />
        </div>
      </div>
      <div class="GuildPanel_inputContainer__test">
        <div class="GuildPanel_label__test">你获得</div>
        <div class="GuildPanel_quantityInputs__test">
          <input id="test-exchange-count" type="text" value="3000" aria-label="你获得" />
        </div>

  </div>
  <div class="test-sidebar-wrapper" id="test-sidebar-wrapper" data-sidebar-layout="wide">
    <div
      class="test-sidebar-resize-gutter"
      id="test-sidebar-resize-gutter"
      role="separator"
      aria-label="调整侧栏宽度"
      aria-orientation="vertical"
      tabindex="0"

    <aside id="test-sidebar">

          <nav id="test-tabs">
            <button data-tab-key="inventory" type="button">库存</button

    <section class="tabPanelsContainer" data-native-content>
      <span data-native-content-copy>原生右侧内容</span>
    </section>
  </div>
  <div class="test-sidebar-wrapper" id="test-narrow-sidebar-wrapper" data-sidebar-layout="narrow">
    <aside>
      <div class="sidebar-shell">
        <div class="tabs-shell">
          <nav>
            <button data-tab-key="inventory" type="button">库存</button
            ><button data-tab-key="equipment" type="button">装备</button
            ><button data-tab-key="skills" type="button">技能</button
            ><button data-tab-key="house" type="button">房屋</button
            ><button data-tab-key="loadout" type="button">配装</button>
          </nav>
        </div>
      </div>
    </aside>
    <section class="tabPanelsContainer" data-native-content>
      <span data-native-content-copy>原生窄屏内容</span>
    </section>
  </div>
  <script>
    const searchParams = new URLSearchParams(location.search);
    const tokenGuideAudit = searchParams.get("tokenGuideAudit") === "1";
    const surplusPlan = searchParams.get("surplusPlan") === "1" || tokenGuideAudit;
    const layoutAudit = searchParams.get("layoutAudit") === "1";
    const stabilityAudit = searchParams.get("stabilityAudit") === "1";
    const creditAudit = searchParams.get("creditAudit") === "1";
    const marketFilterAudit = searchParams.get("marketFilterAudit") === "1";
    const upgradeEmptyAudit = searchParams.get("upgradeEmptyAudit") === "1";
    const constructionAudit = searchParams.get("constructionAudit") === "1";
    const constructionSnapshotAudit = searchParams.get("constructionSnapshotAudit") === "1";
    const settingsAudit = searchParams.get("settingsAudit") === "1";
    const localeRaceAudit = searchParams.get("localeRaceAudit") === "1";
    const sidebarResizeAudit = searchParams.get("sidebarResizeAudit") === "1";
    const sidebarStartupAudit = searchParams.get("sidebarStartupAudit") === "1";
    const upgradeEmptyAuditStageKey = "mwi-upgrade-empty-audit-stage-v1";
    const upgradeEmptyAuditEvidenceKey = "mwi-upgrade-empty-audit-evidence-v1";
    const upgradeEmptyAuditStage = upgradeEmptyAudit ? sessionStorage.getItem(upgradeEmptyAuditStageKey) : "";
    if (layoutAudit || upgradeEmptyAudit || constructionAudit || constructionSnapshotAudit || settingsAudit)
      document.body.dataset.layoutAudit = "true";
    if (sidebarResizeAudit) document.body.dataset.sidebarResizeAudit = "true";
    if (
      (surplusPlan ||
        layoutAudit ||
        creditAudit ||
        marketFilterAudit ||
        upgradeEmptyAudit ||
        constructionAudit ||
        constructionSnapshotAudit ||
        settingsAudit ||
        localeRaceAudit ||
        sidebarResizeAudit ||
        sidebarStartupAudit) &&
      searchParams.get("resetState") === "1" &&
      upgradeEmptyAuditStage !== "reloaded"
    ) {
      localStorage.removeItem("mwi-guild-credit-ui-state-v1");
      localStorage.removeItem(`mwi-guild-building-planner-v1:${location.hostname}:default`);
    }
    if (upgradeEmptyAudit && searchParams.get("resetState") === "1" && upgradeEmptyAuditStage !== "reloaded") {
      localStorage.setItem(
        "mwi-guild-credit-ui-state-v1",
        JSON.stringify({
          activeView: "upgrade",
          panelOrder: ["upgrade", "credit", "construction"],
          upgradePlans: [{ guildBuffHrid: "/guild_buffs/tempo_life", startLevel: 0, targetLevel: 1 }]
        })
      );
    }
    if (settingsAudit && searchParams.get("resetState") === "1") {
      localStorage.setItem(
        "mwi-guild-credit-ui-state-v1",
        JSON.stringify({
          activeView: "construction",
          panelOrder: ["construction", "credit", "upgrade"],
          showConstructionView: true,
          guildShrineAutofillExcludedBuffHrids: [],
          upgradePlans: [{ guildBuffHrid: "/guild_buffs/spirit_life", startLevel: 0, targetLevel: 1 }]
        })
      );
      localStorage.setItem(
        `mwi-guild-building-planner-v1:${location.hostname}:default`,
        JSON.stringify({
          schemaVersion: 1,
          rulesVersion: "2026-08-04-v1",
          manualGuildPoints: 5000,
          category: "all",
          plans: [{ buildingHrid: "/guild_buildings/guild_hall", startLevel: 3, targetLevel: 4 }]
        })
      );
    }
    if (constructionAudit || constructionSnapshotAudit) localStorage.removeItem("initClientData");
    document.body.dataset.sidebarLayout = "wide";
    const english = searchParams.get("locale") === "en";
    const sidebarWidth = Number(searchParams.get("sidebarWidth"));
    if (Number.isFinite(sidebarWidth) && sidebarWidth >= 320 && sidebarWidth <= 1200) {
      document.querySelectorAll(".test-sidebar-wrapper").forEach((wrapper) => {
        wrapper.style.width = `${sidebarWidth}px`;
      });
    }
    const copies = {
      en: {
        pageTitle: "Local sidebar automation harness",
        close: "Close test exchange modal",
        dialog: "Test exchange modal",
        exchangeCount: "Exchange quantity",
        nativeContent: "Native sidebar content",
        tabs: {
          inventory: "Inventory",
          equipment: "Equipment",
          skills: "Skills",
          house: "House",
          loadout: "Loadout",
          harvest: "Harvest"
        }
      },
      "zh-CN": {
        pageTitle: "本地右侧栏自动化测试页",
        close: "关闭测试兑换窗口",
        dialog: "测试兑换窗口",
        exchangeCount: "兑换数量",
        nativeContent: "原生右侧内容",
        tabs: {
          inventory: "库存",
          equipment: "装备",
          skills: "技能",
          house: "房屋",
          loadout: "配装",
          harvest: "收获"
        }
      }
    };
    const i18nextListeners = new Map();
    const initialRuntimeLocale = english || localeRaceAudit ? "en" : "zh-CN";
    document.documentElement.lang = initialRuntimeLocale;
    window.i18next = {
      language: initialRuntimeLocale,
      resolvedLanguage: initialRuntimeLocale,
      on(eventName, listener) {
        if (typeof listener !== "function") return this;
        if (!i18nextListeners.has(eventName)) i18nextListeners.set(eventName, new Set());
        i18nextListeners.get(eventName).add(listener);
        return this;
      },
      off(eventName, listener) {
        if (typeof listener === "function") i18nextListeners.get(eventName)?.delete(listener);
        else i18nextListeners.delete(eventName);
        return this;
      }
    };
    const applyHarnessNativeCopy = (locale) => {
      const normalizedLocale = String(locale).toLowerCase().startsWith("zh") ? "zh-CN" : "en";
      const copy = copies[normalizedLocale];
      document.title = copy.pageTitle;
      document.getElementById("test-page-title").textContent = copy.pageTitle;
      document.getElementById("close-exchange-modal").textContent = copy.close;
      document.getElementById("test-exchange-modal").setAttribute("aria-label", copy.dialog);
      document.getElementById("test-exchange-count").setAttribute("aria-label", copy.exchangeCount);
      document.querySelectorAll("[data-native-content-copy]").forEach((content) => {
        content.textContent = copy.nativeContent;
      });
      document.querySelectorAll("[data-tab-key]").forEach((tab) => {
        tab.textContent = copy.tabs[tab.dataset.tabKey];
      });
      return normalizedLocale;
    };
    window.__mwiHarnessSetLocale = (locale) => {
      const normalizedLocale = applyHarnessNativeCopy(locale);
      document.documentElement.lang = normalizedLocale;
      window.i18next.language = normalizedLocale;
      window.i18next.resolvedLanguage = normalizedLocale;
      for (const listener of i18nextListeners.get("languageChanged") || []) listener(normalizedLocale);
      window.dispatchEvent(new Event("languagechange"));
      return normalizedLocale;
    };
    applyHarnessNativeCopy(localeRaceAudit ? "zh-CN" : initialRuntimeLocale);
    document.getElementById("toggle-responsive-layout").addEventListener("click", () => {
      const narrow = document.body.dataset.sidebarLayout !== "narrow";
      document.body.dataset.sidebarLayout = narrow ? "narrow" : "wide";
      document.getElementById("toggle-responsive-layout").textContent = narrow ? "切换宽屏布局" : "切换窄屏布局";
      window.dispatchEvent(new Event("resize"));
    });
    const resizeGutter = document.getElementById("test-sidebar-resize-gutter");
    const resizeWrapper = document.getElementById("test-sidebar-wrapper");
    let sidebarResizeDrag = null;
    resizeGutter.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      sidebarResizeDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startWidth: resizeWrapper.getBoundingClientRect().width
      };
      try {
        resizeGutter.setPointerCapture?.(event.pointerId);
      } catch (_) {
        // Synthetic harness pointers are not registered as active browser pointers.
      }
      event.preventDefault();
    });
    window.addEventListener("pointermove", (event) => {
      if (!sidebarResizeDrag || event.pointerId !== sidebarResizeDrag.pointerId) return;
      const nextWidth = Math.min(
        1200,
        Math.max(320, sidebarResizeDrag.startWidth + sidebarResizeDrag.startX - event.clientX)
      );
      resizeWrapper.style.width = `${nextWidth}px`;
      window.dispatchEvent(new Event("resize"));
    });
    const finishSidebarResize = (event) => {
      if (!sidebarResizeDrag || event.pointerId !== sidebarResizeDrag.pointerId) return;
      try {
        resizeGutter.releasePointerCapture?.(event.pointerId);
      } catch (_) {
        // Synthetic harness pointers may not own capture.
      }
      sidebarResizeDrag = null;
    };
    window.addEventListener("pointerup", finishSidebarResize);
    window.addEventListener("pointercancel", finishSidebarResize);
    window.__mwiGuildCreditBridge = {
      itemDetails: {
        "/items/guild_token": { itemHrid: "/items/guild_token", name: "Guild Token" },
        "/items/green_guild_credit": { itemHrid: "/items/green_guild_credit", name: "Green Guild Credit" },
        "/items/brown_guild_credit": { itemHrid: "/items/brown_guild_credit", name: "Brown Guild Credit" },
        "/items/white_guild_credit": { itemHrid: "/items/white_guild_credit", name: "White Guild Credit" },
        "/items/blue_guild_credit": { itemHrid: "/items/blue_guild_credit", name: "Blue Guild Credit" },
        "/items/purple_guild_credit": { itemHrid: "/items/purple_guild_credit", name: "Purple Guild Credit" },
        "/items/red_guild_credit": { itemHrid: "/items/red_guild_credit", name: "Red Guild Credit" },
        "/items/silver_guild_credit": { itemHrid: "/items/silver_guild_credit", name: "Silver Guild Credit" },
        "/items/gold_guild_credit": { itemHrid: "/items/gold_guild_credit", name: "Gold Guild Credit" },
        "/items/cheese": { itemHrid: "/items/cheese", name: "Cheese" },
        "/items/beast_hide": {
          itemHrid: "/items/beast_hide",
          name: "Beast Hide",
          guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 4, creditCount: 1 }]
        },
        "/items/sage_market_charm": {
          itemHrid: "/items/sage_market_charm",
          name: "Sage Market Charm",
          guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 1, creditCount: 100 }]
        },
        "/items/master_market_charm": {
          itemHrid: "/items/master_market_charm",
          name: "Master Milking Charm",
          guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 1, creditCount: 100 }]
        },
        "/items/grandmaster_market_charm": {
          itemHrid: "/items/grandmaster_market_charm",
          name: "Grandmaster Enhancing Charm",
          guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 1, creditCount: 100 }]
        },
        "/items/below_range_material": {
          itemHrid: "/items/below_range_material",
          name: "Below Range Material",
          guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 1, creditCount: 100 }]
        },
        "/items/purple_plan_material": {
          itemHrid: "/items/purple_plan_material",
          name: "Purple Plan Material",
          guildCreditConversions: [{ creditItemHrid: "/items/purple_guild_credit", itemCount: 1, creditCount: 1 }]
        },
        "/items/silver_plan_material": {
          itemHrid: "/items/silver_plan_material",
          name: "Silver Plan Material",
          guildCreditConversions: [{ creditItemHrid: "/items/silver_guild_credit", itemCount: 1, creditCount: 1 }]
        }
      },
      guildBuffDetails: {
        "/guild_buffs/tempo_life": {
          guildBuffHrid: "/guild_buffs/tempo_life",
          shrineHrid: "/guild_shrines/tempo",
          isCombat: false,
          levelCosts: surplusPlan
            ? [
                null,
                {
                  guildTokenCost: 0,
                  creditCosts: [
                    { itemHrid: "/items/purple_guild_credit", count: 3000 },
                    { itemHrid: "/items/silver_guild_credit", count: 3000 },
                    { itemHrid: "/items/green_guild_credit", count: 3000 }
                  ]
                }
              ]
            : [
                null,
                { guildTokenCost: 1200, creditCosts: [{ itemHrid: "/items/green_guild_credit", count: 6000 }] },
                { guildTokenCost: 1800, creditCosts: [{ itemHrid: "/items/brown_guild_credit", count: 2000 }] }
              ]
        },
        "/guild_buffs/tempo_combat": {
          guildBuffHrid: "/guild_buffs/tempo_combat",
          shrineHrid: "/guild_shrines/tempo",
          isCombat: true,
          levelCosts: [
            null,
            { guildTokenCost: 900, creditCosts: [{ itemHrid: "/items/green_guild_credit", count: 4500 }] },
            { guildTokenCost: 1500, creditCosts: [{ itemHrid: "/items/brown_guild_credit", count: 1600 }] }
          ]
        },
        "/guild_buffs/spirit_life": {
          guildBuffHrid: "/guild_buffs/spirit_life",
          shrineHrid: "/guild_shrines/spirit",

          levelCosts: [

        "/guild_buffs/spirit_combat": {

          levelCosts: [

            { guildTokenCost: 600, creditCosts: [{ itemHrid: "/items/green_guild_credit", count: 2500 }] },

      },
      characterGuildBuffMap: {
        "/guild_buffs/tempo_life": { guildBuffHrid: "/guild_buffs/tempo_life", level: surplusPlan ? 0 : 1 },
        "/guild_buffs/tempo_combat": { guildBuffHrid: "/guild_buffs/tempo_combat", level: 0 },
        "/guild_buffs/spirit_life": { guildBuffHrid: "/guild_buffs/spirit_life", level: 0 },
        "/guild_buffs/spirit_combat": { guildBuffHrid: "/guild_buffs/spirit_combat", level: 0 }
      },
      guildShrineMap: {
        "/guild_shrines/tempo": { guildShrineHrid: "/guild_shrines/tempo", level: 2 },
        "/guild_shrines/spirit": { guildShrineHrid: "/guild_shrines/spirit", level: 2 }
      },
      guildBuildingMap: {
        "/guild_buildings/guild_hall": { guildBuildingHrid: "/guild_buildings/guild_hall", level: 3 },
        "/guild_buildings/skilling_encampment": { guildBuildingHrid: "/guild_buildings/skilling_encampment", level: 2 },
        "/guild_buildings/gym": { guildBuildingHrid: "/guild_buildings/gym", level: 1 }
      },
      characterItems: surplusPlan
        ? [
            { itemHrid: "/items/guild_token", itemLocationHrid: "/item_locations/inventory", count: 10000 },
            { itemHrid: "/items/purple_guild_credit", itemLocationHrid: "/item_locations/inventory", count: 0 },
            { itemHrid: "/items/silver_guild_credit", itemLocationHrid: "/item_locations/inventory", count: 0 },
            { itemHrid: "/items/green_guild_credit", itemLocationHrid: "/item_locations/inventory", count: 0 }
          ]
        : [

            { itemHrid: "/items/brown_guild_credit", itemLocationHrid: "/item_locations/inventory", count: 0 }
          ]
    };
    if (marketFilterAudit) {
      window.__mwiGuildCreditBridge.marketObserverActive = true;
      window.__mwiGuildCreditBridge.marketOrderBookRevision = 5;
      window.__mwiGuildCreditBridge.marketOrderBooks = {
        beast_hide: {
          revision: 1,
          receivedAt: Date.now(),
          update: { itemHrid: "/items/beast_hide", levels: { 0: { a: 55, b: 50, min: 40, max: 65 } } }
        },
        sage_market_charm: {
          revision: 2,
          receivedAt: Date.now(),
          update: { itemHrid: "/items/sage_market_charm", levels: { 0: { a: 60, b: 50, min: 40, max: 70 } } }
        },
        master_market_charm: {
          revision: 3,
          receivedAt: Date.now(),
          update: { itemHrid: "/items/master_market_charm", levels: { 0: { a: 61, b: 51, min: 40, max: 70 } } }
        },
        grandmaster_market_charm: {
          revision: 4,
          receivedAt: Date.now(),
          update: { itemHrid: "/items/grandmaster_market_charm", levels: { 0: { a: 62, b: 52, min: 40, max: 70 } } }
        },
        below_range_material: {
          revision: 5,
          receivedAt: Date.now(),
          update: { itemHrid: "/items/below_range_material", levels: { 0: { a: 20, b: 1, min: 10, max: 25 } } }
        }
      };
    } else {
      delete window.__mwiGuildCreditBridge.itemDetails["/items/sage_market_charm"];
      delete window.__mwiGuildCreditBridge.itemDetails["/items/master_market_charm"];
      delete window.__mwiGuildCreditBridge.itemDetails["/items/grandmaster_market_charm"];
      delete window.__mwiGuildCreditBridge.itemDetails["/items/below_range_material"];
    }
    if (constructionSnapshotAudit) {
      const completeGuildBuildingSnapshot = {
        guildBuildingMap: window.__mwiGuildCreditBridge.guildBuildingMap
      };
      localStorage.setItem("initClientData", JSON.stringify(completeGuildBuildingSnapshot));
      delete window.__mwiGuildCreditBridge.guildBuildingMap;
    }
    if (sidebarStartupAudit) {
      const delayedSidebarWrappers = Array.from(document.querySelectorAll(".test-sidebar-wrapper"));
      delayedSidebarWrappers.forEach((wrapper) => wrapper.remove());
      const startupMutationNoise = document.createElement("span");
      startupMutationNoise.hidden = true;
      document.body.append(startupMutationNoise);
      let startupMutationCount = 0;
      const startupMutationTimer = window.setInterval(() => {
        startupMutationNoise.replaceChildren(document.createElement("i"));
        startupMutationCount += 1;
        document.body.dataset.sidebarStartupMutationCount = String(startupMutationCount);
      }, 10);
      window.setTimeout(() => window.clearInterval(startupMutationTimer), 900);
      document.body.dataset.sidebarStartupFixtureRemovedAt = String(performance.now());
      window.setTimeout(() => {
        document.body.dataset.sidebarStartupCreditTabBeforeInsert = String(
          Boolean(document.querySelector('[data-mwi-credit-tab="true"]'))
        );
        document.body.append(...delayedSidebarWrappers);
        document.body.dataset.sidebarStartupFixtureInsertedAt = String(performance.now());
      }, 160);
    }

  <script>
    document.getElementById("close-exchange-modal").addEventListener("click", () => {

      await waitFor(() => root.dataset.activeView === "upgrade");
      const settingsTrigger = root.querySelector('[data-role="toggle-settings"]');
      if (settingsTrigger.getAttribute("aria-expanded") !== "true") settingsTrigger.click();
      const firstShrineInput = await waitFor(() => root.querySelector('[data-role="settings-shrine-autofill"]'), 6000);
      firstShrineInput.focus();
      if (firstShrineInput.checked) firstShrineInput.click();
      firstShrineInput.focus();
      await new Promise((resolve) => setTimeout(resolve, 180));

      const excludedHrid = firstShrineInput.dataset.guildBuffHrid;
      const initial = {
        htmlLocale: document.documentElement.lang,
        i18nextLanguage: window.i18next.language,
        i18nextResolvedLanguage: window.i18next.resolvedLanguage,
        nativeFirstTab: normalizedText(document.querySelector('#test-tabs [data-tab-key="inventory"]')),
        copy: pluginLocaleSnapshot(),
        state: localeAuditStateSnapshot(excludedHrid)
      };

      const localeChangedAt = performance.now();
      window.__mwiHarnessSetLocale("en");
      await new Promise((resolve) => setTimeout(resolve, 3200));
      root = await waitFor(() => {
        const candidate = document.getElementById("mwi-credit-optimizer");
        return candidate && !candidate.hidden ? candidate : null;
      }, 6000);
      const switched = {
        elapsedMs: Math.round(performance.now() - localeChangedAt),
        htmlLocale: document.documentElement.lang,
        i18nextLanguage: window.i18next.language,
        i18nextResolvedLanguage: window.i18next.resolvedLanguage,
        nativeFirstTab: normalizedText(document.querySelector('#test-tabs [data-tab-key="inventory"]')),
        copy: pluginLocaleSnapshot(),
        state: localeAuditStateSnapshot(excludedHrid)
      };

      const report = { initial, switched };
      report.checks = {
        fixtureStartsWithConflictingSignals:
          initial.htmlLocale === "en" &&
          initial.i18nextLanguage === "en" &&
          initial.i18nextResolvedLanguage === "en" &&
          initial.nativeFirstTab === "库存",
        visibleNativeChineseWinsInitialRace: localeSnapshotMatches(initial.copy, localeAuditCopy["zh-CN"]),
        initialKeyCopyContainsNoEnglish: localeSnapshotExcludes(initial.copy, localeAuditCopy.en),
        localeSwitchRunsAfterThreeSecondInspection:
          switched.elapsedMs >= 3000 &&
          switched.htmlLocale === "en" &&
          switched.i18nextLanguage === "en" &&
          switched.i18nextResolvedLanguage === "en" &&
          switched.nativeFirstTab === "Inventory",
        staticAndDynamicCopySwitchToEnglish: localeSnapshotMatches(switched.copy, localeAuditCopy.en),
        switchedKeyCopyContainsNoChinese: localeSnapshotExcludes(switched.copy, localeAuditCopy["zh-CN"]),
        activeViewSurvivesLocaleRefresh:
          initial.state.activeView === "upgrade" &&
          switched.state.activeView === initial.state.activeView &&
          switched.state.selectedView === "view-upgrade",
        settingsStateSurvivesLocaleRefresh:
          initial.state.settingsOpen &&
          switched.state.settingsOpen &&
          initial.state.constructionChecked &&
          switched.state.constructionChecked &&
          initial.state.excludedChecked === false &&
          switched.state.excludedChecked === false &&
          initial.state.persistedExcluded &&
          switched.state.persistedExcluded,
        focusSurvivesLocaleRefresh:
          initial.state.focus.inPlugin &&
          switched.state.focus.inPlugin &&
          switched.state.focus.role === initial.state.focus.role &&
          switched.state.focus.guildBuffHrid === initial.state.focus.guildBuffHrid
      };
      document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
      document.body.dataset.localeRaceAuditFailed = "false";
      document.body.dataset.localeRaceAuditReady = "true";
      return report;
    };

    window.__mwiLocaleRaceAuditReady = localeRaceAudit
      ? prepareLocaleRaceAudit().catch((error) => {
          const report = {
            failed: true,
            error: {
              name: String(error?.name || "Error"),
              message: String(error?.message || error || "Unknown locale race audit error"),
              stack: String(error?.stack || "")
            },
            checks: { auditCompleted: false }
          };
          document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
          document.body.dataset.localeRaceAuditFailed = "true";
          document.body.dataset.localeRaceAuditReady = "true";
          return report;
        })
      : Promise.resolve(null);

    const prepareSidebarStartupAudit = async () => {
      const fixtureInsertedAt = Number(
        await waitFor(() => document.body.dataset.sidebarStartupFixtureInsertedAt, 2000)
      );
      const creditTab = await waitFor(() => document.querySelector('#test-tabs [data-mwi-credit-tab="true"]'), 1000);
      const mountedAt = performance.now();
      const panel = await waitFor(() => document.getElementById("mwi-credit-optimizer"), 1000);
      creditTab.click();
      await waitFor(() => !panel.hidden, 1000);
      const noise = document.createElement("span");
      noise.hidden = true;
      document.body.append(noise);
      noise.remove();
      await new Promise((resolve) => setTimeout(resolve, 180));

      const report = {
        fixtureRemovedAt: Number(document.body.dataset.sidebarStartupFixtureRemovedAt),
        fixtureInsertedAt,
        mountedAt,
        mountLatencyMs: mountedAt - fixtureInsertedAt,
        creditTabBeforeFixtureInsert: document.body.dataset.sidebarStartupCreditTabBeforeInsert,
        mutationCountAtMeasurement: Number(document.body.dataset.sidebarStartupMutationCount || 0),
        creditTabLabel: normalizedText(creditTab),
        creditTabCount: document.querySelectorAll('[data-mwi-credit-tab="true"]').length,
        panelConnected: panel.isConnected,
        panelVisibleAfterClick: !panel.hidden
      };
      report.checks = {
        fixtureActuallyDelaysSidebar:
          Number.isFinite(report.fixtureRemovedAt) &&
          report.fixtureInsertedAt > report.fixtureRemovedAt &&
          report.creditTabBeforeFixtureInsert === "false" &&
          report.mutationCountAtMeasurement >= 5,
        creditTabMountsWithinHalfSecond: report.mountLatencyMs >= 0 && report.mountLatencyMs < 500,
        creditTabUsesChineseGameLocale: report.creditTabLabel === "信用",
        exactlyOneCreditTabAfterFurtherMutations: report.creditTabCount === 1,
        mountedPanelOpensNormally: report.panelConnected && report.panelVisibleAfterClick
      };
      document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
      document.body.dataset.sidebarStartupAuditFailed = "false";
      document.body.dataset.sidebarStartupAuditReady = "true";
      return report;
    };

    window.__mwiSidebarStartupAuditReady = sidebarStartupAudit
      ? prepareSidebarStartupAudit().catch((error) => {
          const report = {
            failed: true,
            error: {
              name: String(error?.name || "Error"),
              message: String(error?.message || error || "Unknown sidebar startup audit error"),
              stack: String(error?.stack || "")
            },
            checks: { auditCompleted: false }
          };
          document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
          document.body.dataset.sidebarStartupAuditFailed = "true";
          document.body.dataset.sidebarStartupAuditReady = "true";
          return report;
        })
      : Promise.resolve(null);

    const prepareSidebarResizeAudit = async () => {
      const creditTab = await waitFor(() => document.querySelector('#test-tabs [data-mwi-credit-tab="true"]'), 6000);
      creditTab.click();
      const root = await waitFor(() => {
        const candidate = document.getElementById("mwi-credit-optimizer");
        return candidate && !candidate.hidden ? candidate : null;
      }, 6000);
      const wrapper = document.getElementById("test-sidebar-wrapper");
      const gutter = document.getElementById("test-sidebar-resize-gutter");
      const initialWrapperRect = elementRect(wrapper);
      const initialGutterRect = elementRect(gutter);
      const initialGutterStyle = getComputedStyle(gutter);
      const initialCenter = {
        x: initialGutterRect.left + initialGutterRect.width / 2,
        y: initialGutterRect.top + initialGutterRect.height / 2
      };
      const initialHit = document.elementFromPoint(initialCenter.x, initialCenter.y);
      const pointerId = 91;
      dispatchAuditPointer(gutter, "pointerdown", {
        pointerId,
        pointerType: "mouse",
        isPrimary: true,
        button: 0,
        buttons: 1,
        clientX: initialCenter.x,
        clientY: initialCenter.y
      });
      dispatchAuditPointer(window, "pointermove", {
        pointerId,
        pointerType: "mouse",
        isPrimary: true,
        button: -1,
        buttons: 1,
        clientX: initialCenter.x - 64,
        clientY: initialCenter.y
      });
      dispatchAuditPointer(window, "pointerup", {
        pointerId,
        pointerType: "mouse",
        isPrimary: true,
        button: 0,
        buttons: 0,
        clientX: initialCenter.x - 64,
        clientY: initialCenter.y
      });
      await new Promise((resolve) => setTimeout(resolve, 240));

      const finalWrapperRect = elementRect(wrapper);
      const finalGutterRect = elementRect(gutter);
      const finalCenter = {
        x: finalGutterRect.left + finalGutterRect.width / 2,
        y: finalGutterRect.top + finalGutterRect.height / 2
      };
      const finalHit = document.elementFromPoint(finalCenter.x, finalCenter.y);
      const report = {
        requestedSidebarWidth: Number(searchParams.get("sidebarWidth")) || null,
        initial: {
          wrapper: initialWrapperRect,
          gutter: initialGutterRect,
          gutterCursor: initialGutterStyle.cursor,
          gutterZIndex: initialGutterStyle.zIndex,
          overlapWithSidebar: initialGutterRect.right - initialWrapperRect.left,
          centerHit: {
            id: initialHit?.id || "",
            className: String(initialHit?.className || "")
          }
        },
        final: {
          wrapper: finalWrapperRect,
          gutter: finalGutterRect,
          centerHit: {
            id: finalHit?.id || "",
            className: String(finalHit?.className || "")
          },
          widthDelta: finalWrapperRect.width - initialWrapperRect.width,
          rootOverflow: Math.max(0, root.scrollWidth - root.clientWidth)
        }
      };
      report.checks = {
        nativeGutterFixtureMatchesContract:
          Math.abs(initialGutterRect.width - 10) <= 0.5 &&
          Math.abs(report.initial.overlapWithSidebar - 5) <= 0.5 &&
          report.initial.gutterCursor === "col-resize" &&
          report.initial.gutterZIndex === "1",
        gutterCenterWinsHitTesting: initialHit === gutter,
        pointerDragChangesSidebarWidth: report.final.widthDelta >= 60,
        gutterRemainsReachableAfterResize: finalHit === gutter,
        pluginHasNoHorizontalOverflow: report.final.rootOverflow === 0
      };
      document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
      document.body.dataset.sidebarResizeAuditFailed = "false";
      document.body.dataset.sidebarResizeAuditReady = "true";
      return report;
    };

    window.__mwiSidebarResizeAuditReady = sidebarResizeAudit
      ? prepareSidebarResizeAudit().catch((error) => {
          const report = {
            failed: true,
            error: {
              name: String(error?.name || "Error"),
              message: String(error?.message || error || "Unknown sidebar resize audit error"),
              stack: String(error?.stack || "")
            },
            checks: { auditCompleted: false }
          };
          document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
          document.body.dataset.sidebarResizeAuditFailed = "true";
          document.body.dataset.sidebarResizeAuditReady = "true";
          return report;
        })
      : Promise.resolve(null);

    const runPlanStabilityAudit = async () => {
      await window.__mwiLayoutAuditReady;
      const list = await waitFor(() => document.querySelector('[data-role="upgrade-plan-list"]'));
      const firstPlan = await waitFor(() => list.querySelector(".mwi-upgrade-plan"));
      let mutationCount = 0;
      const observer = new MutationObserver((records) => {
        mutationCount += records.length;
      });
      observer.observe(list, { attributes: true, childList: true, subtree: true });
      const bridge = window.__mwiGuildCreditBridge;
      for (let index = 0; index < 3; index += 1) {
        bridge.characterItems = bridge.characterItems.map((item) =>
          item.itemHrid === "/items/guild_token" ? { ...item, count: item.count + 1 } : item
        );
        bridge.characterItemsRevision = Number(bridge.characterItemsRevision || 0) + 1;
        bridge.onCharacterItemsUpdated?.();
        await new Promise((resolve) => setTimeout(resolve, 220));
      }
      observer.disconnect();
      return {
        mutationCount,
        sameFirstPlan: list.querySelector(".mwi-upgrade-plan") === firstPlan,
        indexCount: list.querySelectorAll(".mwi-upgrade-plan-index").length,
        animationName: getComputedStyle(firstPlan).animationName,
        rootOverflow:
          document.getElementById("mwi-credit-optimizer").scrollWidth -
          document.getElementById("mwi-credit-optimizer").clientWidth
      };
    };

    if (stabilityAudit) {
      window.__mwiPlanStabilityReady = runPlanStabilityAudit().then((report) => {
        document.getElementById("layout-audit-output").textContent = JSON.stringify(report);
        document.body.dataset.planStabilityReady = "true";
        return report;
      });
    }
  </script>
</html>
